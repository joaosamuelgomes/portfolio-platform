# SonarCloud, analysed from CI (the "Sonar" job in .github/workflows/ci.yml): the API needs its
# compiled classes and JaCoCo report, which automatic analysis cannot produce.
sonar.organization=joaosamuelgomes
sonar.projectKey=joaosamuelgomes_portfolio-platform
sonar.projectName=portfolio-platform

sonar.sources=api/src/main,admin/src,scripts,deploy
sonar.tests=api/src/test,admin/src
sonar.test.inclusions=admin/src/**/*.test.ts,admin/src/**/*.test.tsx,admin/src/test/**
sonar.exclusions=admin/src/**/*.test.ts,admin/src/**/*.test.tsx,admin/src/test/**,admin/src/api/schema.d.ts
sonar.sourceEncoding=UTF-8

sonar.java.source=21
sonar.java.binaries=api/target/classes
sonar.java.test.binaries=api/target/test-classes
sonar.java.libraries=api/target/libs/*.jar
sonar.coverage.jacoco.xmlReportPaths=api/target/site/jacoco/jacoco.xml

sonar.javascript.lcov.reportPaths=admin/coverage/lcov.info
