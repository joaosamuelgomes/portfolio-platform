spring:
  application:
    name: portfolio-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio}
    username: ${DATABASE_USERNAME:portfolio}
    password: ${DATABASE_PASSWORD:portfolio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  http:
    client:
      # Only outgoing call: the site's Deploy Hook.
      connect-timeout: 5s
      read-timeout: 10s

app:
  site:
    deploy-hook-url: ${SITE_DEPLOY_HOOK_URL:}
  security:
    jwt:
      secret: ${JWT_SECRET:}
      ttl: ${JWT_TTL:PT1H}
    users:
      - username: ${ADMIN_USERNAME:admin}
        password: ${ADMIN_PASSWORD:}
        role: ADMIN
      - username: ${VIEWER_USERNAME:recrutador}
        password: ${VIEWER_PASSWORD:}
        role: VIEWER
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

server:
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
