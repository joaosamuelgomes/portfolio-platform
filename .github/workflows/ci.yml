name: CI/CD

# Every push and pull request runs the API and admin checks. A push to main also publishes the
# API image to GHCR and deploys it to the VM (deploy/README.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  api:
    name: API (unit and integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - run: ./mvnw -B verify
      # Classes, dependencies and the JaCoCo report for the Sonar job.
      - run: ./mvnw -B -q dependency:copy-dependencies -DincludeScope=compile -DoutputDirectory=target/libs
      - uses: actions/upload-artifact@v7
        with:
          name: api-analysis
          path: |
            api/target/classes
            api/target/test-classes
            api/target/libs
            api/target/site/jacoco/jacoco.xml
          retention-days: 1

  admin:
    name: Admin panel (lint, tests and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      # No dependency lifecycle scripts: nothing in the tree needs one.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      # lcov paths are relative to admin/; Sonar reads them from the repository root.
      - run: sed -i 's#^SF:#SF:admin/#' coverage/lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: admin-coverage
          path: admin/coverage/lcov.info
          retention-days: 1

  sonar:
    name: SonarCloud analysis
    needs: [api, admin]
    # Pull requests from forks get no secrets, so they skip the analysis.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # blame data for new-code detection
      - uses: actions/download-artifact@v8
        with:
          name: api-analysis
          path: api/target
      - uses: actions/download-artifact@v8
        with:
          name: admin-coverage
          path: admin/coverage
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  image:
    name: Publish API image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [api, admin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Third-party actions pinned to a commit; Dependabot proposes the updates.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The VM is ARM (Ampere); Maven runs natively and only the runtime stage is emulated.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/joaosamuelgomes/portfolio-api:${{ github.sha }}
            ghcr.io/joaosamuelgomes/portfolio-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to the VM
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Pinned host key: the job refuses to talk to anything but the real VM.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship deploy/ and start the new image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh_vm() { ssh -i ~/.ssh/deploy -o BatchMode=yes "$DEPLOY_HOST" "$@"; }
          caddy_before=$(ssh_vm 'sha256sum portfolio-platform/deploy/Caddyfile 2>/dev/null || true')
          tar -c deploy | ssh_vm 'mkdir -p portfolio-platform && tar -x -C portfolio-platform && chmod +x portfolio-platform/deploy/*.sh'
          caddy_after=$(ssh_vm 'sha256sum portfolio-platform/deploy/Caddyfile')
          # The job's token reaches the VM on stdin, only for this pull, and is logged out after.
          printf '%s' "$GHCR_TOKEN" | ssh_vm "cd portfolio-platform/deploy \
            && docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null \
            && API_IMAGE_TAG=$TAG docker compose pull api; status=\$?; docker logout ghcr.io >/dev/null; exit \$status"
          # Also tagged latest on the VM, so a plain "docker compose up -d" there keeps this image.
          ssh_vm "cd portfolio-platform/deploy \
            && docker tag ghcr.io/joaosamuelgomes/portfolio-api:$TAG ghcr.io/joaosamuelgomes/portfolio-api:latest \
            && docker compose up -d --no-build --remove-orphans && docker image prune -f >/dev/null"
          if [ "$caddy_before" != "$caddy_after" ]; then
            ssh_vm 'cd portfolio-platform/deploy && docker compose restart caddy'
          fi
      - name: Check the API is up
        run: |
          for attempt in $(seq 1 30); do
            curl -fsS https://api.madebyjoaogomes.com/actuator/health && exit 0
            sleep 5
          done
          echo "API did not become healthy" >&2
          exit 1
